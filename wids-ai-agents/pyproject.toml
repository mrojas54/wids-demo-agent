[project]
name = "wids-ai-agents"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [{ name = "Michelle Rojas", email = "michelle.rojas@graphika.com" }]
requires-python = ">=3.13,<4.0.0"
dependencies = [
    "ipython>=9.0.2",
    "langchain>=0.3.21",
    "langchain-openai>=0.3.9",
    "langgraph>=0.3.18",
    "pandas[performance]>=2.2.3",
    "pydantic-ai-slim[duckduckgo,logfire,openai]>=0.0.43",
    "python-pptx>=1.0.2",
    "seaborn>=0.13.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wids"]
